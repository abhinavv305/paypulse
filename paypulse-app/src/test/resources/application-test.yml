spring:
  datasource:
    url: jdbc:h2:mem:paypulse_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

paypulse:
  providers:
    stripe:
      base-url: http://localhost:8089
      api-key: sk_test_test
      webhook-secret: whsec_test_secret_for_tests_only
    adyen:
      base-url: http://localhost:8089
      api-key: test_adyen_key
      merchant-account: TestAccount
      hmac-key: 44782def4f...
  outbox:
    poll-interval-ms: 600000
  webhook:
    process-interval-ms: 600000
  reconciliation:
    interval-ms: 600000
